<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SomaiyaSat mission control</title>
<style>
/* ------------------------------------------------------------------ fonts
   Served by Streamlit's own static file server out of app/static/fonts.
   Nothing here touches the network. */
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
  src:url('/app/static/fonts/inter-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
  src:url('/app/static/fonts/inter-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;
  src:url('/app/static/fonts/inter-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;
  src:url('/app/static/fonts/inter-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url('/app/static/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;
  src:url('/app/static/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');}

:root{
  --black:#000000; --white:#ffffff; --accent:#3d6bff; --accent-soft:#8ea6ff;
  --muted:#8a8f98; --border:rgba(255,255,255,.12); --surface:rgba(255,255,255,.05);
  --radius:12px; --good:#3ddc97; --fair:#ffb547; --poor:#ff5c7a;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--black);overflow:hidden;}
body{font-family:var(--sans);color:var(--white);-webkit-font-smoothing:antialiased;}

#stage{position:relative;width:100%;height:100vh;min-height:820px;background:var(--black);
  border:1px solid var(--border);border-radius:16px;overflow:hidden;}
#globe{position:absolute;inset:0;}
#globe canvas{display:block;}

.glass{background:rgba(6,8,14,.62);-webkit-backdrop-filter:blur(22px) saturate(120%);
  backdrop-filter:blur(22px) saturate(120%);
  border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);}

.mono{font-family:var(--mono);}
.lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}

/* ------------------------------------------------------------------ top bar */
#topbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:30;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0));}
.wordmark{display:inline-flex;align-items:center;gap:0;font-size:1.05rem;font-weight:600;
  letter-spacing:-.015em;line-height:1;color:var(--white);}
.wordmark svg{width:1.02em;height:1.02em;margin:0 .01em;flex:none;}
.spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:.3rem .66rem;
  background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
#clock{font-family:var(--mono);font-size:.7rem;color:var(--white);letter-spacing:.06em;}
#clock span{color:var(--muted);}
a.backlink{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:999px;
  padding:.3rem .66rem;background:rgba(255,255,255,.05);transition:.15s;}
a.backlink:hover{color:var(--white);border-color:rgba(61,107,255,.55);background:rgba(61,107,255,.14);}

/* ------------------------------------------------------------------ satellites */
.sat{position:relative;width:46px;height:46px;margin:-23px 0 0 -23px;cursor:pointer;
  pointer-events:auto;user-select:none;}
.sat .halo{position:absolute;inset:7px;border-radius:50%;border:1px solid currentColor;
  opacity:.34;animation:sonar 2.6s ease-out infinite;}
@keyframes sonar{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.5);opacity:0}}
.sat .body{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:11px;height:11px;border-radius:3px;background:currentColor;
  box-shadow:0 0 10px currentColor;}
.sat .tag{position:absolute;left:28px;top:12px;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.1em;white-space:nowrap;color:var(--white);
  background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:6px;padding:1px 5px;}
.sat.selected .tag{border-color:currentColor;color:currentColor;}
.sat:hover .tag{border-color:currentColor;}

/* Real tracked objects read differently from the proposed mission: a hollow
   diamond rather than a filled square, and a quieter tag. The distinction is
   deliberate -- one is flying, the other is a proposal. */
.sat-real .body{width:9px;height:9px;border-radius:2px;background:transparent;
  border:1.5px solid currentColor;box-shadow:0 0 7px currentColor;
  transform:translate(-50%,-50%) rotate(45deg);}
.sat-real .halo{animation-duration:4.2s;opacity:.22;}
.sat-real .tag{font-size:.55rem;opacity:.82;letter-spacing:.06em;}
.sat-real:hover .tag,.sat-real.selected .tag{opacity:1;}

/* separator + styling for the real-satellite cards in the right column */
.card-sep{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);padding:12px 2px 2px;}
.card-real{border-style:dashed;}

/* Playback speed control. Stacked directly above the legend in the left
   column: anchoring it bottom-right put it on top of the satellite cards. */
#speed{position:absolute;left:18px;bottom:124px;z-index:25;padding:7px 9px;
  display:flex;align-items:center;gap:6px;width:max-content;}
#speed .lab{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-right:2px;}
#speed button{font-family:var(--mono);font-size:.62rem;color:var(--muted);
  background:transparent;border:1px solid var(--border);border-radius:999px;
  padding:.2rem .52rem;cursor:pointer;transition:.15s;}
#speed button:hover{color:var(--white);border-color:rgba(61,107,255,.55);}
#speed button.on{color:#fff;border-color:rgba(61,107,255,.85);
  background:rgba(61,107,255,.2);}
#ffwd{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:#ffb547;
  margin-left:4px;display:none;}
#ffwd.on{display:inline;}

/* ------------------------------------------------------------------ left panel */
#panel{position:absolute;left:18px;top:68px;width:326px;max-height:calc(100% - 132px);
  overflow-y:auto;overflow-x:hidden;padding:16px 16px 18px;z-index:25;
  opacity:0;transform:translateX(-14px);pointer-events:none;transition:opacity .25s,transform .25s;}
#panel.open{opacity:1;transform:none;pointer-events:auto;}
#panel::-webkit-scrollbar{width:6px;}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
.panel-head{display:flex;align-items:flex-start;gap:10px;}
.panel-title{font-family:var(--mono);font-size:1.02rem;font-weight:500;letter-spacing:.04em;margin:0;}
.panel-close{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:8px;width:24px;height:24px;line-height:1;cursor:pointer;font-size:.8rem;flex:none;}
.panel-close:hover{color:var(--white);border-color:rgba(61,107,255,.55);}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.56rem;
  letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:.24rem .55rem;
  border:1px solid currentColor;margin-top:6px;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:.42rem 0;
  border-top:1px solid rgba(255,255,255,.07);font-size:.78rem;}
.kv .k{color:var(--muted);}
.kv .v{font-family:var(--mono);font-size:.74rem;text-align:right;}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.stat{border:1px solid var(--border);border-radius:10px;padding:.55rem .6rem;background:rgba(255,255,255,.03);}
.stat .n{font-family:var(--mono);font-size:1.02rem;font-weight:500;margin-top:2px;display:block;}
.chips{display:flex;gap:10px;margin-top:10px;}
.chip{position:relative;width:64px;height:64px;border-radius:50%;border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:rgba(255,255,255,.04);cursor:default;flex:none;}
.chip .m{font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;color:var(--white);}
.chip .c{font-family:var(--mono);font-size:.62rem;color:var(--muted);}
.chip.on{border-color:rgba(61,107,255,.55);background:rgba(61,107,255,.12);}
.chip.off{opacity:.34;border-style:dashed;}
.chip.off .m{text-decoration:line-through;}
.chip .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  width:206px;padding:.5rem .6rem;font-size:.68rem;line-height:1.4;color:#d4d7dc;
  background:#0d0d0f;border:1px solid var(--border);border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;}
.chip:hover .tip{opacity:1;}
.spark{margin-top:6px;}

/* ------------------------------------------------------------------ right cards */
#cards{position:absolute;right:18px;top:68px;width:236px;z-index:25;
  display:flex;flex-direction:column;gap:10px;}
.card{padding:12px 13px;cursor:pointer;transition:border-color .15s,background .15s;}
.card:hover{border-color:rgba(61,107,255,.5);background:rgba(61,107,255,.07);}
.card.selected{border-color:rgba(61,107,255,.75);background:rgba(61,107,255,.10);}
.card-top{display:flex;align-items:center;gap:7px;}
.card-id{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;}
.card-link{margin-left:auto;font-family:var(--mono);font-size:.6rem;}
.card-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;}
.card-row .k{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);}
.card-row .v{font-family:var(--mono);font-size:.82rem;}
.trend{font-family:var(--mono);font-size:.62rem;margin-left:5px;}
.countdown{font-family:var(--mono);font-size:.92rem;letter-spacing:.04em;color:var(--white);}

/* ------------------------------------------------------------------ chrome */
#legend{position:absolute;left:18px;bottom:16px;z-index:25;padding:9px 12px;
  display:flex;flex-direction:column;gap:5px;}
#legend .row{display:flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:.6rem;letter-spacing:.08em;color:var(--muted);}
#legend .sw{width:16px;height:2px;border-radius:2px;}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:25;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:.38rem .8rem;}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:35;font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);background:var(--black);transition:opacity .5s;}
#boot.gone{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<div id="stage">
  <div id="globe"></div>

  <div id="topbar">
    <div class="wordmark">
      <span>SomaiyaS</span><svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <ellipse cx="11" cy="11.5" rx="9.4" ry="4.5" transform="rotate(-28 11 11.5)"
                 stroke="#3d6bff" stroke-width="1.7"/>
        <circle cx="11" cy="11.5" r="3.6" fill="#3d6bff" fill-opacity=".20"
                stroke="#3d6bff" stroke-width="1.5"/>
        <circle cx="18.4" cy="7.3" r="1.85" fill="#3d6bff"/>
      </svg><span>t</span>
    </div>
    <span class="pill" id="rolepill"><span class="dot"></span><span id="roletext">role</span></span>
    <div class="spacer"></div>
    <div id="clock">--:--:--&nbsp;<span>UTC</span></div>
    <a class="backlink" href="http://localhost:5500" target="_blank" rel="noopener">&larr; Landing</a>
  </div>

  <aside id="panel" class="glass"></aside>
  <aside id="cards"></aside>

  <div id="legend" class="glass">
    <div class="row"><span class="sw" style="background:#3ddc97"></span>Link &ge; 70 &middot; good</div>
    <div class="row"><span class="sw" style="background:#ffb547"></span>Link 40&ndash;69 &middot; fair</div>
    <div class="row"><span class="sw" style="background:#ff5c7a"></span>Link &lt; 40 &middot; poor</div>
    <div class="row" style="margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.1)">
      <span class="sw" style="width:8px;height:8px;border-radius:2px;background:#8ea6ff"></span>SomaiyaSat &middot; proposed</div>
    <div class="row"><span class="sw" style="width:8px;height:8px;border-radius:2px;
      background:transparent;border:1.5px solid #8ea6ff;transform:rotate(45deg)"></span>Real orbit &middot; SGP4</div>
  </div>
  <div id="hint" class="glass">Drag to rotate &middot; Click a satellite</div>

  <div id="speed" class="glass">
    <span class="lab">Speed</span>
    <span id="ffwd">FAST-FORWARD</span>
  </div>

  <div id="boot">Acquiring orbit&hellip;</div>
</div>

<script src="/app/static/vendor/globe.gl.min.js"></script>
<!-- satellite.js (MIT), vendored like globe.gl so the page still makes zero
     external requests. This is the SGP4 propagator; it turns the real element
     sets in DATA.tracked into real positions. Verified to agree with the
     Python sgp4 the database uses to 0.00004 degrees. -->
<script src="/app/static/vendor/satellite.min.js"></script>
<script>
(function () {
"use strict";

var DATA = /*__DATA__*/;

var C = { accent:"#3d6bff", soft:"#8ea6ff", muted:"#8a8f98",
          good:"#3ddc97", fair:"#ffb547", poor:"#ff5c7a" };

function linkColour(s){ if(s===null||s===undefined) return C.muted;
  return s>=70 ? C.good : (s>=40 ? C.fair : C.poor); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function num(v,d){ return (v===null||v===undefined||isNaN(v)) ? "&mdash;" : Number(v).toFixed(d===undefined?2:d); }

/* ==================================================================== orbits
   This globe shows TWO kinds of object, and never blurs the line between them.

   1. CUBE01-03 -- the PROPOSED SomaiyaSat mission. It has not launched, so
      there is no ephemeris to propagate. Their tracks are an analytic model of
      the intended sun-synchronous profile: 97.5 deg inclination, ~93 min.

   2. DATA.tracked -- REAL amateur-radio satellites in orbit right now,
      propagated from real CelesTrak element sets with SGP4 via satellite.js.
      These are the flight heritage behind the modes the mission proposes, and
      they are how the ground segment gets validated before launch.

   Both are drawn at the same instant of real UTC, so the picture is coherent.
   ======================================================================== */
var EARTH_R_KM  = 6371;
var EARTH_DAY_S = 86164;
var TRAIL_N     = 70;        // trail samples

/* ---- 1. the proposed mission (analytic model) ---- */
var INCL     = 97.5 * Math.PI / 180;
var PERIOD_S = 93 * 60;
var ALT      = 0.15;         // globe radii above the surface
var TRAIL_SPAN_S = PERIOD_S * 0.30;

var ORBIT_PHASE = { CUBE01: 0, CUBE02: 132, CUBE03: 247 };
var ORBIT_RAAN  = { CUBE01: 24, CUBE02: -58, CUBE03: 148 };

function subpoint(cube, tSec){
  var u = (ORBIT_PHASE[cube] || 0) * Math.PI/180 + 2*Math.PI * (tSec / PERIOD_S);
  var lat = Math.asin(Math.sin(INCL) * Math.sin(u)) * 180/Math.PI;
  var dl  = Math.atan2(Math.cos(INCL) * Math.sin(u), Math.cos(u)) * 180/Math.PI;
  var lng = (ORBIT_RAAN[cube] || 0) + dl - 360 * (tSec / EARTH_DAY_S);
  return { lat: lat, lng: lng, alt: ALT };  // longitude unwrapped on purpose
}

/* ---- 2. the real fleet (SGP4) ---- */
/* Playback speed. Default 1 = genuinely live: the satellites sit where they
   really are, matching the UTC clock in the bar above. Anything faster is
   still real physics, just fast-forwarded, and the badge says so -- it must
   never be mistaken for a live position. */
var SPEED = 1;
var SPEEDS = [1, 60, 300];

var HAVE_SGP4 = (typeof satellite !== "undefined" &&
                 typeof satellite.twoline2satrec === "function");

var TRACKED = [];
if (HAVE_SGP4) {
  (DATA.tracked || []).forEach(function(t){
    var rec;
    try { rec = satellite.twoline2satrec(t.tle_line1, t.tle_line2); }
    catch (e) { return; }                       // unusable element set: skip
    if (!rec || rec.error) return;
    TRACKED.push({
      norad_id: t.norad_id,
      name: t.object_name,
      modes: t.payload_modes || "TT&C",
      period_min: t.period_min,
      inclination_deg: t.inclination_deg,
      tle_age_days: t.tle_age_days,
      tle_status: t.tle_status,
      next_aos: t.next_aos,
      next_link: t.next_link,
      rec: rec,
      real: true,
      colour: linkColour(t.next_link),
      lat: 0, lng: 0, alt: ALT
    });
  });
}

/* Propagate one real satellite to an absolute UTC instant. Returns null when
   the element set cannot be evaluated there (a decayed object, for instance),
   so callers must check rather than plot a bogus point. */
function realSubpoint(rec, whenMs){
  var d = new Date(whenMs);
  var pv;
  try { pv = satellite.propagate(rec, d); } catch (e) { return null; }
  if (!pv || !pv.position) return null;
  var gd = satellite.eciToGeodetic(pv.position, satellite.gstime(d));
  var lat = satellite.degreesLat(gd.latitude);
  var lng = satellite.degreesLong(gd.longitude);
  if (isNaN(lat) || isNaN(lng)) return null;
  return { lat: lat, lng: lng, alt: gd.height / EARTH_R_KM };
}

/* A real propagator returns longitude wrapped to [-180,180]. Feeding that
   straight into a trail makes the path leap the full width of the map every
   time it crosses the antimeridian, so unwrap the sequence first. */
function unwrapLng(points){
  for (var i = 1; i < points.length; i++){
    var d = points[i].lng - points[i-1].lng;
    if (d > 180)       points[i].lng -= 360;
    else if (d < -180) points[i].lng += 360;
  }
  return points;
}

function haversineKm(a, b){
  var R = 6371, toR = Math.PI/180;
  var dLat = (b.lat-a.lat)*toR, dLng = (b.lng-a.lng)*toR;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
}

/* Elevation and slant range of a satellite as seen from a ground station.
   The JavaScript twin of look_angles() in scripts/_orbit.py -- same WGS-84
   ellipsoid, so the arcs drawn here agree with the passes in tracked_pass.
   Elevation is the angle above the station's local horizon; negative means
   below it, and therefore not workable however close it looks on the map. */
var WGS84_A = 6378.137, WGS84_F = 1/298.257223563;
var WGS84_E2 = WGS84_F * (2 - WGS84_F);

function ecef(latDeg, lngDeg, altKm){
  var la = latDeg * Math.PI/180, lo = lngDeg * Math.PI/180;
  var N = WGS84_A / Math.sqrt(1 - WGS84_E2 * Math.sin(la)*Math.sin(la));
  return [ (N+altKm)*Math.cos(la)*Math.cos(lo),
           (N+altKm)*Math.cos(la)*Math.sin(lo),
           (N*(1-WGS84_E2)+altKm)*Math.sin(la) ];
}

function lookAngles(station, sat){
  var stAlt = (station.alt_m || 0) / 1000;
  var g = ecef(station.lat, station.lng, stAlt);
  var s = ecef(sat.lat, sat.lng, (sat.alt || 0) * EARTH_R_KM);
  var dx = s[0]-g[0], dy = s[1]-g[1], dz = s[2]-g[2];
  var rng = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (rng === 0) return { el: 90, range: 0 };
  var la = station.lat * Math.PI/180, lo = station.lng * Math.PI/180;
  var ux = Math.cos(la)*Math.cos(lo), uy = Math.cos(la)*Math.sin(lo), uz = Math.sin(la);
  var sinEl = Math.max(-1, Math.min(1, (dx*ux + dy*uy + dz*uz) / rng));
  return { el: Math.asin(sinEl) * 180/Math.PI, range: rng };
}

/* ------------------------------------------------------------------ data prep */
var STATIONS = DATA.stations || [];
var PAYLOADS = DATA.payloads || [];
var ROLE     = DATA.role || "";
var SATS = (DATA.satellites || []).filter(function(s){
  return s.deployed && ORBIT_PHASE.hasOwnProperty(s.cube_id);
});

SATS.forEach(function(s){
  s.colour = linkColour(s.link_score);
  s.lat = 0; s.lng = 0; s.alt = ALT; s.trail = [];
  s.real = false;                 // proposed mission, analytic track
  s.name = s.cube_id;
  s.uid  = s.cube_id;
});

/* Real objects need an identity that cannot collide with a cube_id, because
   selection, marker classes and the cards are all keyed on it. */
TRACKED.forEach(function(t){ t.uid = "N" + t.norad_id; });

/* Everything the globe draws, in one list: the proposed cubes plus the real
   fleet. Markers, trails, arcs and hit-testing all iterate this. */
var ALL_SATS = SATS.concat(TRACKED);

function bySat(uid){
  for (var i = 0; i < ALL_SATS.length; i++)
    if (ALL_SATS[i].uid === uid) return ALL_SATS[i];
  return null;
}

/* Where a satellite is at an absolute UTC instant, whichever kind it is. */
function satPosition(s, whenMs, simSec){
  if (s.real) return realSubpoint(s.rec, whenMs);
  return subpoint(s.cube_id, simSec);
}

/* The planner's own rules, mirrored for display only. The authoritative copy
   lives in plan_pass() in sql/ -- nothing here changes a decision. */
function eligibility(sat){
  var out = {};
  var b = sat.battery_latest, link = sat.link_score;
  PAYLOADS.forEach(function(p){ out[p.payload_type] = { ok: true, why: "" }; });
  if (b === null || b === undefined){
    PAYLOADS.forEach(function(p){
      if (p.payload_type !== "TT&C")
        out[p.payload_type] = { ok:false, why: p.payload_type +
          " skipped: no battery telemetry for " + sat.cube_id + ", so the router stays in TT&C-only safe mode." };
    });
    return out;
  }
  if (b < 6.8 || link < 40){
    var reason = b < 6.8
      ? "battery " + num(b) + "V below the 6.8V safe-mode floor"
      : "link score " + link + " below the 40 threshold";
    PAYLOADS.forEach(function(p){
      if (p.payload_type !== "TT&C")
        out[p.payload_type] = { ok:false,
          why: p.payload_type + " skipped: " + reason + " — safe mode, TT&C only." };
    });
  } else if (b <= 7.2){
    if (out["SSTV"]) out["SSTV"] = { ok:false,
      why: "SSTV skipped: battery " + num(b) + "V below the 7.2V threshold." };
  }
  return out;
}

/* ---------------------------------------------------------- sun + night ---
 * globe.gl's default lights are an ambient plus a directional light that
 * three.js parks at (0,1,0) and globe.gl never moves. Against the old night
 * texture that was invisible; against a daytime texture it lights the globe
 * from straight above -- bright poles, dark equator, obviously wrong.
 *
 * world.lights() hands back the live light objects, so they can be retuned and
 * repositioned in place. No THREE constructor is needed, which matters: the
 * bundled globe.gl only *reads* window.THREE, it does not export it.
 * ------------------------------------------------------------------------ */
var SUN = { amb: null, dir: null, lastMin: -1 };
var CLOUDS = null;

(function initLights(){
  var L = world.lights ? world.lights() : null;
  if (!L || L.length < 2) return;
  SUN.amb = L[0];
  SUN.dir = L[1];
  // Lift the ambient so the night side reads as dusk rather than a black void,
  // and keep the key light strong enough to give a clear terminator.
  SUN.amb.intensity = Math.PI * 0.62;
  SUN.dir.intensity = Math.PI * 0.95;
  world.lights(L);
})();

/* Sub-solar point for a given time, so the terminator matches the UTC clock
 * in the top bar instead of being decorative. */
function updateSun(now){
  if (!SUN.dir) return;
  var mins = now.getUTCHours() * 60 + now.getUTCMinutes();
  if (mins === SUN.lastMin) return;          // once a minute is plenty
  SUN.lastMin = mins;

  // Day of year -> solar declination (approx, good to a fraction of a degree).
  var start = Date.UTC(now.getUTCFullYear(), 0, 0);
  var doy = Math.floor((now.getTime() - start) / 86400000);
  var decl = -23.44 * Math.cos((2 * Math.PI / 365) * (doy + 10));

  // The sub-solar longitude sweeps 360 degrees per UTC day.
  var lng = 180 - (mins / 1440) * 360;

  // three-globe's own lat/lng -> cartesian convention (phi from the north
  // pole, theta measured from +Z at lng 0). This is NOT the same convention
  // the landing page's landmask.ts uses, and getting it wrong puts the sun on
  // the far side of the planet.
  var phi = (90 - decl) * Math.PI / 180;
  var theta = (90 - lng) * Math.PI / 180;

  var D = 800;
  SUN.dir.position.set(
    D * Math.sin(phi) * Math.cos(theta),
    D * Math.cos(phi),
    D * Math.sin(phi) * Math.sin(theta)
  );
}
updateSun(new Date());

/* ------------------------------------------------------- surface detail ---
 * Three things turn a flat painted ball into something that reads as a solid
 * body: relief (bump), a sun glint that only the oceans return (specular),
 * and a separate cloud shell that casts its own shading and sits visibly
 * ABOVE the surface.
 *
 * All of it is built without a THREE import. The bundle only *reads*
 * window.THREE, so every constructor is reached through an object three.js
 * already made for us.
 * ------------------------------------------------------------------------ */
(function surface(){
  if (!world.globeMaterial) return;
  var mat = world.globeMaterial();
  if (!mat) return;

  mat.bumpScale = 3.2;

  /* Build an independent Texture from a URL.
   * NOT mat.map.clone(): three.js Texture.clone() shares the underlying
   * Source by reference, so assigning .image to a clone rewrites the map it
   * was cloned from. Construct a fresh one instead. */
  function loadTexture(url, cb){
    if (!mat.map) return;
    var TextureCtor = mat.map.constructor;
    var img = new Image();
    img.onload = function(){
      var tex = new TextureCtor(img);
      tex.colorSpace = mat.map.colorSpace;
      tex.wrapS = mat.map.wrapS;
      tex.wrapT = mat.map.wrapT;
      tex.minFilter = mat.map.minFilter;
      tex.magFilter = mat.map.magFilter;
      tex.needsUpdate = true;
      cb(tex);
    };
    img.src = url;
  }

  var attempts = 0;
  (function whenReady(){
    if (!mat.map) {
      if (attempts++ > 160) return;            // give up after ~2.5s
      return setTimeout(whenReady, 16);
    }

    /* city lights on the unlit hemisphere */
    loadTexture("/app/static/textures/earth_night.jpg", function(tex){
      mat.emissiveMap = tex;
      if (mat.emissive && mat.emissive.setRGB) mat.emissive.setRGB(1, 1, 1);
      mat.emissiveIntensity = 0.9;
      mat.needsUpdate = true;
    });

    /* oceans return the sun, land does not — the glint is the strongest
     * single cue that this is a sphere and not a disc */
    loadTexture("/app/static/textures/earth_specular.jpg", function(tex){
      mat.specularMap = tex;
      if (mat.specular && mat.specular.setRGB) mat.specular.setRGB(0.42, 0.52, 0.68);
      mat.shininess = 26;
      mat.needsUpdate = true;
    });

    /* cloud shell, parented to the globe so it inherits every transform */
    loadTexture("/app/static/textures/earth_clouds.jpg", function(tex){
      var globeMesh = null;
      world.scene().traverse(function(o){
        if (!globeMesh && o.isMesh && o.material === mat) globeMesh = o;
      });
      if (!globeMesh || !globeMesh.geometry || !globeMesh.geometry.parameters) return;

      var MeshCtor = globeMesh.constructor;
      var GeoCtor  = globeMesh.geometry.constructor;
      var MatCtor  = mat.constructor;
      var r = globeMesh.geometry.parameters.radius;
      if (!r) return;

      var cloudMat = new MatCtor({
        map: tex,
        alphaMap: tex,          // bright cloud = opaque, clear sky = invisible
        transparent: true,
        opacity: 0.62,
        depthWrite: false,
        specular: 0x000000
      });
      var clouds = new MeshCtor(new GeoCtor(r * 1.012, 72, 48), cloudMat);
      clouds.renderOrder = 1;
      globeMesh.add(clouds);
      CLOUDS = clouds;
    });
  })();
})();

/* ------------------------------------------------------------------ animation */
/* The simulation clock is accumulated rather than derived from a start time, so
   changing SPEED cannot make the displayed instant jump: each frame advances it
   by the real frame time multiplied by SPEED. */
var t0        = Date.now();     // wall clock at boot (drives the analytic model)
var simNowMs  = Date.now();     // the instant currently being displayed
var lastFrame = Date.now();
var lastArcKey = "";
var lastTrail = 0;

function tick(){
  /* One clock drives everything. At SPEED = 1 it tracks real time exactly, so
     the real satellites sit where they actually are and agree with the UTC
     clock in the bar above. */
  var real = Date.now();
  if (SPEED === 1) simNowMs = real;             // live: never drift from now
  else             simNowMs += (real - lastFrame) * SPEED;
  lastFrame = real;

  var nowMs = simNowMs;
  var tSim  = (simNowMs - t0) / 1000;

  // Weather drifts slowly relative to the surface, and the sun moves with
  // real UTC time. Both are cheap; updateSun() no-ops except once a minute.
  if (CLOUDS) CLOUDS.rotation.y = tSim * 0.0006;
  updateSun(new Date(nowMs));

  ALL_SATS.forEach(function(s){
    var p = satPosition(s, nowMs, tSim);
    if (p){ s.lat = p.lat; s.lng = p.lng; s.alt = p.alt; s.ok = true; }
    else  { s.ok = false; }          // unusable elements: hide, never guess
  });
  world.htmlElementsData(ALL_SATS.filter(function(s){ return s.ok !== false; }));

  /* trails, refreshed a few times a second */
  if (Date.now() - lastTrail > 220){
    lastTrail = Date.now();
    var paths = [];
    ALL_SATS.forEach(function(s){
      var pts = [];
      if (s.real){
        /* A real trail spans a real fraction of THIS satellite's own orbit,
           so AO-7's 115-minute track is drawn longer than a 91-minute one. */
        var spanMs = (s.period_min || 93) * 60 * 1000 * 0.30;
        var seq = [];
        for (var i = TRAIL_N; i >= 0; i--){
          var q = realSubpoint(s.rec, nowMs - spanMs * (i / TRAIL_N));
          if (q) seq.push(q);
        }
        if (seq.length < 2) return;
        unwrapLng(seq);
        pts = seq.map(function(q){ return [q.lat, q.lng, q.alt]; });
      } else {
        for (var j = TRAIL_N; j >= 0; j--){
          var r = subpoint(s.cube_id, tSim - TRAIL_SPAN_S * (j / TRAIL_N));
          pts.push([r.lat, r.lng, ALT]);
        }
      }
      paths.push({ pts: pts, colors: [fade(s.colour, 0), fade(s.colour, 1)] });
    });
    world.pathsData(paths);
  }

  /* Downlink arcs for satellites a station can actually work.
     The test is real elevation above the station's horizon -- the same
     quantity tracked_pass stores and link_score_from_pass() scores -- not the
     flat 2000 km ground-distance proxy this used before. A satellite 2000 km
     away across the ground is below the horizon and cannot be worked. */
  var live = [];
  ALL_SATS.forEach(function(s){
    if (s.ok === false) return;
    var lngW = ((s.lng % 360) + 540) % 360 - 180;
    STATIONS.forEach(function(st){
      var look = lookAngles(st, { lat: s.lat, lng: lngW, alt: s.alt });
      var mask = (st.min_elevation_deg === undefined) ? 10 : st.min_elevation_deg;
      if (look.el >= mask){
        live.push({
          key: "L:" + s.name + "-" + st.id,
          startLat: st.lat, startLng: st.lng, endLat: s.lat, endLng: s.lng,
          colour: [fade(s.colour, 0.35), fade(s.colour, 1)],
          stroke: 0.75, alt: 0.12, dashLen: 0.32, dashGap: 0.20, dashTime: 1700,
          label: s.name + " → " + st.name + " · " + look.el.toFixed(0) +
                 "° el · " + Math.round(look.range) + " km"
        });
      }
    });
  });
  var key = live.map(function(a){ return a.key; }).join("|");
  if (key !== lastArcKey){
    lastArcKey = key;
    world.arcsData(STATIC_ARCS.concat(live));
  }

  requestAnimationFrame(tick);
}

function fade(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function byCube(id){
  for (var i=0;i<SATS.length;i++) if (SATS[i].cube_id === id) return SATS[i];
  return null;
}

function sparkline(series, colour){
  var pts = (series || []).filter(function(v){ return v !== null && v !== undefined; }).map(Number);
  if (pts.length < 2) return '<div class="lbl" style="margin-top:8px">no 24h battery history</div>';
  var w = 292, h = 46, pad = 3;
  var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
  if (hi - lo < 0.05){ hi += 0.05; lo -= 0.05; }
  var step = (w - pad*2) / (pts.length - 1);
  var coords = pts.map(function(v,i){
    var x = pad + i*step;
    var y = pad + (h - pad*2) * (1 - (v - lo) / (hi - lo));
    return [x, y];
  });
  var line = coords.map(function(c,i){ return (i?"L":"M") + c[0].toFixed(1) + " " + c[1].toFixed(1); }).join(" ");
  var area = line + " L" + coords[coords.length-1][0].toFixed(1) + " " + (h-pad) +
             " L" + pad + " " + (h-pad) + " Z";
  var last = coords[coords.length-1];
  return '<div class="spark"><svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" ' +
    'style="display:block;height:46px">' +
    '<path d="'+area+'" fill="'+fade(colour,0.12)+'"/>' +
    '<path d="'+line+'" fill="none" stroke="'+colour+'" stroke-width="1.4" ' +
    'stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.4" fill="'+colour+'"/>' +
    '</svg></div>' +
    '<div class="lbl" style="display:flex;justify-content:space-between;margin-top:3px">' +
    '<span>24h ago</span><span>'+num(lo)+'V &ndash; '+num(hi)+'V</span><span>now</span></div>';
}

/* Panel for a REAL tracked satellite. It deliberately shows different fields
   from the mission panel: there is no battery telemetry for someone else's

   have is the orbit, the element-set age, and the next real pass. */
function renderRealPanel(sat){

  panel.innerHTML =

    '<div class="lbl" style="margin-top:14px">[&nbsp;Deployer pod&nbsp;]</div>' +
    '<div class="kv"><span class="k">Pod</span><span class="v">' + esc(sat.pod_id) + '</span></div>' +
    '<div class="kv"><span class="k">Mechanism</span><span class="v">' + esc(sat.mech_type) + '</span></div>' +
    '<div class="kv"><span class="k">Confirm status</span><span class="v">' + esc(sat.confirm_status) + '</span></div>' +
    '<div class="kv"><span class="k">Chain</span><span class="v">' + esc(sat.chain_status) + '</span></div>' +

    '<div class="lbl" style="margin-top:14px">[&nbsp;Spacecraft state&nbsp;]</div>' +
    '<div class="grid4">' +
      '<div class="stat"><span class="lbl">Battery</span><span class="n">' + num(sat.battery_latest) + ' V</span></div>' +
      '<div class="stat"><span class="lbl">Temp max</span><span class="n">' + num(sat.temp_max, 1) + ' &deg;C</span></div>' +
      '<div class="stat"><span class="lbl">Link score</span><span class="n" style="color:' +
        sat.colour + '">' + esc(sat.link_score) + '</span></div>' +
      '<div class="stat"><span class="lbl">Sys init</span><span class="n" style="font-size:.8rem">' +
        esc(sat.sys_init) + '</span></div>' +
    '</div>' +

    '<div class="lbl" style="margin-top:14px">[&nbsp;Payload modes&nbsp;]</div>' +
    '<div class="chips">' + chips + '</div>' +

    '<div class="lbl" style="margin-top:16px">[&nbsp;Battery, last 24h&nbsp;]</div>' +
    sparkline(sat.battery_24h, sat.colour);

  panel.querySelector(".panel-close").addEventListener("click", function(){ deselect(); });
  panel.classList.add("open");
}

function select(uid, fly){
  var sat = bySat(uid);
  if (!sat) return;
  selected = uid;
  ALL_SATS.forEach(function(s){ if (s._el) s._el.classList.toggle("selected", s.uid === uid); });
  Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){
    c.classList.toggle("selected", c.getAttribute("data-cube") === uid);
  });
  renderPanel(sat);
  if (fly !== false){
    world.controls().autoRotate = false;
    world.pointOfView({ lat: sat.lat, lng: sat.lng, altitude: 1.55 }, 1100);
  }
}

function deselect(){
  selected = null;
  panel.classList.remove("open");
  ALL_SATS.forEach(function(s){ if (s._el) s._el.classList.remove("selected"); });
  Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){
    c.classList.remove("selected");
  });
  world.controls().autoRotate = true;
  world.pointOfView({ altitude: 2.45 }, 900);
}

world.onGlobeClick(function(){ if (selected) deselect(); });

/* ------------------------------------------------------------------ right cards */
var cards = document.getElementById("cards");
cards.innerHTML = SATS.map(function(s){
  var prev = s.battery_24h_ago, now = s.battery_latest, trend = "";
  if (prev !== null && prev !== undefined && now !== null && now !== undefined){
    var d = now - prev;
    var up = d >= 0;
    trend = '<span class="trend" style="color:' + (up ? C.good : C.poor) + '">' +
            (up ? "▲" : "▼") + " " + Math.abs(d).toFixed(2) + "V</span>";
  }
  return '<div class="card glass" data-cube="' + esc(s.cube_id) + '">' +
    '<div class="card-top"><span class="card-id">' + esc(s.cube_id) + '</span>' +
      '<span class="card-link" style="color:' + s.colour + '">link ' + esc(s.link_score) + '</span></div>' +
    '<div class="card-row"><span class="k">Battery</span>' +
      '<span class="v">' + num(s.battery_latest) + ' V' + trend + '</span></div>' +
    '<div class="card-row"><span class="k">Pending</span>' +
      '<span class="v">' + Number(s.unsent_count || 0).toLocaleString("en-US") + '</span></div>' +
    '<div class="card-row" style="margin-top:9px;border-top:1px solid rgba(255,255,255,.07);padding-top:8px">' +
      '<span class="k">Next pass</span></div>' +
    '<div class="countdown" data-next="' + esc(s.next_pass || "") + '">&mdash;</div>' +
  '</div>';
}).join("") +

/* Real satellites get their own cards, visually separated so nobody reads a
   tracked object as part of the mission. These carry orbital facts, not
   telemetry -- we do not have telemetry for someone else's spacecraft. */
(TRACKED.length
  ? '<div class="card-sep">[&nbsp;Real satellites &middot; SGP4&nbsp;]</div>' +
    TRACKED.map(function(s){
      return '<div class="card glass card-real" data-cube="' + esc(s.uid) + '">' +
        '<div class="card-top"><span class="card-id">' + esc(s.name) + '</span>' +
          '<span class="card-link" style="color:' + s.colour + '">' +
          (s.next_link === null || s.next_link === undefined
             ? '&mdash;' : 'link ' + esc(s.next_link)) + '</span></div>' +
        '<div class="card-row"><span class="k">NORAD</span>' +
          '<span class="v">' + esc(s.norad_id) + '</span></div>' +
        '<div class="card-row"><span class="k">Modes</span>' +
          '<span class="v" style="font-size:.66rem">' + esc(s.modes) + '</span></div>' +
        '<div class="card-row" style="margin-top:9px;border-top:1px solid rgba(255,255,255,.07);padding-top:8px">' +
          '<span class="k">Next pass</span></div>' +
        '<div class="countdown" data-next="' + esc(s.next_aos || "") + '">&mdash;</div>' +
      '</div>';
    }).join("")
  : "");

Array.prototype.forEach.call(cards.querySelectorAll(".card"), function(c){
  c.addEventListener("click", function(){ select(c.getAttribute("data-cube"), true); });
});

/* ------------------------------------------------------------------ clocks */
function two(n){ return (n < 10 ? "0" : "") + n; }

function ticker(){
  var now = new Date();
  document.getElementById("clock").innerHTML =
    two(now.getUTCHours()) + ":" + two(now.getUTCMinutes()) + ":" + two(now.getUTCSeconds()) +
    "&nbsp;<span>UTC</span>";

  /* [data-next] rather than .countdown, so the detail panel's next-pass row
     counts down too and not just the cards. */
  Array.prototype.forEach.call(document.querySelectorAll("[data-next]"), function(node){
    var big = node.classList.contains("countdown");
    var iso = node.getAttribute("data-next");
    if (!iso){ node.innerHTML = "not scheduled"; node.style.color = C.muted;
               if (big) node.style.fontSize = ".7rem"; return; }
    var delta = Math.floor((new Date(iso).getTime() - now.getTime()) / 1000);
    if (delta <= 0){ node.textContent = "PASS WINDOW OPEN"; node.style.color = C.good;
                     if (big) node.style.fontSize = ".72rem"; return; }
    var h = Math.floor(delta / 3600), m = Math.floor(delta % 3600 / 60), s = delta % 60;
    node.textContent = "T− " + two(h) + ":" + two(m) + ":" + two(s);
    node.style.color = "#ffffff";
    if (big) node.style.fontSize = ".92rem";
  });
  setTimeout(ticker, 1000);
}

/* ------------------------------------------------------------------ speed */
/* The default is 1x, which means the real satellites are where they really
   are. Faster settings are still real physics -- SGP4 evaluated at a future
   instant -- but the badge makes sure nobody reads a fast-forwarded position
   as a live one. */
(function(){
  var box = document.getElementById("speed");
  var badge = document.getElementById("ffwd");
  SPEEDS.forEach(function(v){
    var b = document.createElement("button");
    b.textContent = v === 1 ? "live" : v + "×";
    b.className = (v === SPEED) ? "on" : "";
    b.addEventListener("click", function(){
      /* The accumulator carries the displayed instant across the change, so
         nothing teleports. Selecting "live" snaps back to the real present,
         which is what live has to mean. */
      SPEED = v;
      lastFrame = Date.now();
      if (SPEED === 1) simNowMs = Date.now();
      Array.prototype.forEach.call(box.querySelectorAll("button"), function(x){
        x.classList.remove("on");
      });
      b.classList.add("on");
      badge.classList.toggle("on", SPEED !== 1);
      badge.textContent = "FAST-FORWARD ×" + SPEED;
    });
    box.insertBefore(b, badge);
  });
  if (!TRACKED.length){
    /* Nothing real to propagate: the control would imply otherwise. */
    box.style.display = "none";
  }
})();

/* ------------------------------------------------------------------ boot */
document.getElementById("roletext").textContent = ROLE || "not connected";

window.addEventListener("resize", function(){
  world.width(stage.clientWidth).height(stage.clientHeight);
});

ticker();
requestAnimationFrame(tick);
setTimeout(function(){ document.getElementById("boot").classList.add("gone"); }, 900);

})();
</script>
</body>
</html>
